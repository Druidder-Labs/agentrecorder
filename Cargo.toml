[workspace]
resolver = "3"
members = ["crates/witnessed-store", "crates/witnessed-supervisor", "crates/witnessed-assurance", "crates/witnessed-cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Druidder-Labs/witnessed"
homepage = "https://github.com/Druidder-Labs/witnessed"
keywords = ["terminal", "pty", "agents", "session", "replay"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
witnessed-store = { path = "crates/witnessed-store", version = "0.6.0" }
witnessed-supervisor = { path = "crates/witnessed-supervisor", version = "0.6.0" }
witnessed-assurance = { path = "crates/witnessed-assurance", version = "0.6.0" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
crossbeam-channel = "0.5"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
regorus = { version = "0.13", default-features = false, features = ["std", "arc", "glob"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "user", "socket"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
vt100 = "0.18"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
