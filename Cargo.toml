[workspace]
resolver = "3"
members = ["crates/agentrecorder-store", "crates/agentrecorder-supervisor", "crates/agentrecorder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Druidder-Labs/agentrecorder"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
crossbeam-channel = "0.5"
libc = "0.2"
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "user", "socket"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
vt100 = "0.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
