<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; font-src data:; img-src data:; worker-src blob:">
<title>agentrecorder session</title>
<style>__AGENTRECORDER_PLAYER_CSS__</style>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #16191d; --muted: #5a626c; --faint: #5f666f; --on-accent: #ffffff; --line: #e3e6ea;
  --accent: #2b62d9; --accent-soft: #e8effc; --ok: #146b38; --ok-soft: #e4f4ea; --bad: #c0392b; --bad-soft: #fbe9e7;
  --warn: #9a5b00; --warn-soft: #fff1d6; --chip: #eef0f3; --human: #5b3fbf; --human-soft: #efeafc;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e8ebef; --muted: #a3abb6; --faint: #8f98a3; --on-accent: #0f1216; --line: #272d36;
    --accent: #7aa2ff; --accent-soft: #1b2a4a; --ok: #4fc47f; --ok-soft: #14301f; --bad: #ff7b6e; --bad-soft: #3a1c19;
    --warn: #e5aa4a; --warn-soft: #3a2a10; --chip: #222831; --human: #b9a4ff; --human-soft: #2a2342;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e8ebef; --muted: #a3abb6; --faint: #8f98a3; --on-accent: #0f1216; --line: #272d36;
  --accent: #7aa2ff; --accent-soft: #1b2a4a; --ok: #4fc47f; --ok-soft: #14301f; --bad: #ff7b6e; --bad-soft: #3a1c19;
  --warn: #e5aa4a; --warn-soft: #3a2a10; --chip: #222831; --human: #b9a4ff; --human-soft: #2a2342;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
a { color: var(--accent); }
button { font: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 20px 0 12px; }
header.top .brand { font-size: 12px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
header.top h1 { margin: 2px 0 6px; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
header.top h1 .id { font-family: var(--mono); font-weight: 500; color: var(--muted); font-size: 18px; margin-left: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); align-items: center; }
.meta .bad { color: var(--bad); font-weight: 600; }
.meta .cmd { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 4px; }
.meta details { display: inline; }
.meta summary { cursor: pointer; color: var(--accent); list-style: none; display: inline; }
.meta summary::-webkit-details-marker { display: none; }

.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--chip); color: var(--text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badges summary { cursor: pointer; color: var(--accent); list-style: none; font-size: 12.5px; }
.badges summary::-webkit-details-marker { display: none; }
.howto { margin: 10px 0 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-width: 760px; }
.howto p { margin: 0 0 8px; }
.howto p:last-child { margin: 0; }
pre.cmdline { margin: 6px 0; padding: 8px 10px; background: var(--chip); border-radius: 6px; font-family: var(--mono); font-size: 12px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.stat.human .v { color: var(--human); }
.stat.agent .v { color: var(--accent); }
.stat.bad .v { color: var(--bad); }
.unmeasured { font-size: 12px; color: var(--faint); margin: 0 0 18px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 46%); gap: 20px; align-items: start; }
.side { position: sticky; top: 12px; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.panel > h2 { margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel > h2 .now { text-transform: none; letter-spacing: 0; font-weight: 500; font-family: var(--mono); font-size: 12px; color: var(--text); }
.player-wrap { background: #000; min-height: 200px; }
.player-note { padding: 10px 16px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

.story { display: grid; gap: 12px; min-width: 0; }
.story h2.sec { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.turn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; transition: border-color .15s, box-shadow .15s; }
.turn.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.turn.system { background: transparent; border-style: dashed; color: var(--muted); padding: 10px 16px; }
.turn .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.turn .n { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.at { font-family: var(--mono); font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.at:hover { text-decoration: underline; }
.turn .gap { font-size: 12.5px; color: var(--human); }
.turn .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.k { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.k.agent { background: var(--accent-soft); color: var(--accent); }
.k.human { background: var(--human-soft); color: var(--human); }
.k.bad { background: var(--bad-soft); color: var(--bad); }
.k.warn { background: var(--warn-soft); color: var(--warn); }
.prompt { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; padding-left: 12px; border-left: 3px solid var(--human); }
.prompt.hidden { color: var(--muted); font-size: 13.5px; font-style: italic; }
.prompt .origin { display: inline-block; font-style: normal; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--human-soft); color: var(--human); margin-right: 6px; vertical-align: 2px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.steps .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.step { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; font-size: 12.5px; background: var(--chip); border: 1px solid transparent; cursor: pointer; color: var(--text); }
.step:hover { border-color: var(--line); }
.step .t { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.step.bad { background: var(--bad-soft); color: var(--bad); }
.step.wait { background: var(--warn-soft); color: var(--warn); }
.step.end { background: var(--ok-soft); color: var(--ok); }
.step.note { background: transparent; border-color: var(--line); color: var(--muted); cursor: default; }
.step.test { background: var(--ok-soft); color: var(--ok); }
.step.test.bad { background: var(--bad-soft); color: var(--bad); }
.step.test.unsure { background: var(--chip); color: var(--text); }
.step.you { background: var(--human-soft); color: var(--human); }
.step .d { font-family: var(--mono); font-size: 11.5px; opacity: .85; max-width: 340px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn > *, .turn .head > *, .steps > * { min-width: 0; max-width: 100%; }
.step { max-width: 100%; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.human { border-color: transparent; background: var(--human-soft); color: var(--human); }
.signals { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 0 0 20px; }
.sig { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.sig h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sig ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; }
.sig li { display: flex; gap: 8px; align-items: baseline; }
.sig li .v { font-weight: 650; min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.sig li .x { color: var(--muted); font-size: 12px; }
.sig-note { font-size: 12px; color: var(--faint); margin: -10px 0 18px; }
ul.files .by { font-size: 12px; color: var(--muted); }
ul.files .by.out { color: var(--warn); }
.commits { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 3px; }
.commits .h { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; }
.empty { color: var(--muted); padding: 14px 16px; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }
ul.files { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }
ul.files li { display: flex; gap: 10px; align-items: baseline; word-break: break-all; }
ul.files .st { font-family: var(--mono); font-size: 12px; width: 14px; color: var(--muted); }
ul.files .st.M { color: var(--warn); } ul.files .st.A, ul.files .st.q { color: var(--ok); } ul.files .st.D { color: var(--bad); }

.lower { margin: 24px 0 32px; display: grid; gap: 12px; }
details.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
details.sec > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 10px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(45deg); }
details.sec > summary .cnt { font-weight: 400; color: var(--muted); font-size: 12.5px; }
details.sec > .body { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 12px; }
.filters button { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.filters button[aria-pressed="false"] { opacity: .45; }
.rows { max-height: 480px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.row { display: grid; grid-template-columns: 76px 88px minmax(0, 1fr); gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; font-size: 13px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--chip); }
.row.current { box-shadow: inset 3px 0 0 var(--accent); }
.row .t { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.row .d { word-break: break-word; }
.row.redacted .d, .row.cut .d { color: var(--warn); }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-all; }
.mono { font-family: var(--mono); font-size: 12px; }
.caveat { color: var(--muted); font-size: 12px; margin-top: 10px; }
code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 6px 0 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-size: 14px; font-weight: 550; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab[hidden] { display: none; }
#tab-overview { display: grid; gap: 14px; max-width: 920px; margin-bottom: 32px; }
#tab-overview[hidden] { display: none; }
.ocard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.ocard > h2 { margin: 0 0 10px; font-size: 16px; font-weight: 650; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
ul.yns { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 14px; }
.yn { display: inline-block; min-width: 96px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; text-align: center; }
.yn.y { background: var(--accent-soft); color: var(--accent); }
.yn.n { background: var(--chip); color: var(--muted); }
.who { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.inp { font: inherit; font-size: 13.5px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.who .inp { margin-left: 6px; }
.comp { border-top: 1px solid var(--line); padding: 14px 0 4px; display: grid; gap: 8px; }
.comp-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.comp h3 { margin: 0; font-size: 15px; font-weight: 650; }
.who-tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.who-tag.hr { background: var(--human-soft); color: var(--human); }
.who-tag.technical { background: var(--accent-soft); color: var(--accent); }
.comp .ask { margin: 0; color: var(--muted); }
ul.evidence { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.levels { display: flex; flex-wrap: wrap; gap: 6px; }
.lvl { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.lvl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.note { width: 100%; resize: vertical; }
.print-only { display: none; white-space: pre-wrap; font-size: 13.5px; }
ol.qs { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
dl.gloss { grid-template-columns: max-content minmax(0, 1fr); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: inherit; font-weight: 600; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
details.dfile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
details.dfile > summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; list-style: none; }
details.dfile > summary::-webkit-details-marker { display: none; }
details.dfile .path { font-family: var(--mono); font-size: 13px; font-weight: 600; word-break: break-all; }
details.dfile .plus { color: var(--ok); font-family: var(--mono); font-size: 12px; }
details.dfile .minus { color: var(--bad); font-family: var(--mono); font-size: 12px; }
pre.diff { margin: 0; padding: 10px 0; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; line-height: 1.45; overflow-x: auto; }
pre.diff span { display: block; padding: 0 14px; white-space: pre; min-height: 1.45em; }
pre.diff .a { background: var(--ok-soft); color: var(--ok); }
pre.diff .r { background: var(--bad-soft); color: var(--bad); }
pre.diff .h { color: var(--accent); background: var(--accent-soft); }
pre.diff .m { color: var(--faint); }
@media print {
  body { background: #fff; }
  .tabs, .actions, #tab-timeline, #tab-code, #tab-details, .badges details { display: none !important; }
  #tab-overview { display: grid !important; max-width: none; }
  .ocard { break-inside: avoid; border-color: #ccc; }
  .lvl, textarea.note, .who .inp::placeholder { display: none; }
  .print-only { display: block !important; }
  .at { color: inherit; }
}
@media (max-width: 640px) {
  .row { grid-template-columns: 64px minmax(0, 1fr); }
  .row .c { display: none; }
  .prompt { font-size: 14px; }
  dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  dt { margin-top: 6px; }
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">agentrecorder</div>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="badges" id="badges"></div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
<section class="tab" id="tab-overview"></section>
<section class="tab" id="tab-timeline" hidden>
<section class="stats" id="stats"></section>
<div class="unmeasured" id="unmeasured"></div>
<section class="signals" id="signals"></section>
<div class="sig-note" id="sig-note"></div>
<div class="layout">
  <main class="story" id="story"></main>
  <aside class="side">
    <section class="panel">
      <h2>Terminal <span class="now" id="now"></span></h2>
      <div class="player-wrap" id="player"></div>
      <div class="player-note" id="player-note"></div>
    </section>
  </aside>
</div>
</section>
<section class="tab" id="tab-code" hidden><div id="code"></div></section>
<section class="tab lower" id="tab-details" hidden>
  <details class="sec" id="files-sec" open><summary>Files changed <span class="cnt" id="files-cnt"></span></summary><div class="body" id="files"></div></details>
  <details class="sec"><summary>All events <span class="cnt" id="events-cnt"></span></summary><div class="body"><div class="filters" id="filters"></div><div class="rows" id="rows"></div></div></details>
  <details class="sec"><summary>Session details</summary><div class="body" id="session"></div></details>
  <details class="sec" open><summary>Verification and integrity</summary><div class="body" id="integrity"></div></details>
</section>
</div>
<script id="data" type="application/json">__AGENTRECORDER_DATA__</script>
<script>__AGENTRECORDER_PLAYER_JS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const M = D.manifest, S = M.session;
const $ = id => document.getElementById(id);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
}
function dur(ms) {
  if (ms == null) return "-";
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : m ? `${m}m ${String(r).padStart(2, "0")}s` : `${r}s`;
}
function secs(ms) {
  if (ms == null) return "-";
  if (ms < 10000) return `${(ms / 1000).toFixed(1)}s`;
  return ms < 60000 ? `${Math.round(ms / 1000)}s` : dur(ms);
}
function off(ms) {
  const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(x => String(x).padStart(2, "0")).join(":");
}
const num = n => Number(n || 0).toLocaleString("en-US");
const kilo = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e4 ? `${Math.round(n / 1e3)}k` : num(n);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const sum = xs => xs.reduce((a, b) => a + (b || 0), 0);
const short = h => (h ? String(h).slice(0, 10) : "-");
const when = ns => new Date(ns / 1e6).toISOString().replace("T", " ").slice(0, 16) + " UTC";

const promptLink = t => el("button", { type: "button", class: "at", title: "Open in the timeline", onclick: () => { seek(t.t_ms); } }, `#${t.index} at ${off(t.t_ms)}`);
const momentLink = (ms, label) => el("button", { type: "button", class: "at", title: "Play from here", onclick: () => seek(ms) }, label || off(ms));
const goCode = label => el("button", { type: "button", class: "at", onclick: () => showTab("code") }, label);
const rate = n => (n === 1 ? "once" : `${n} times`);

// Overview
const ov = $("tab-overview");
const card = (title, ...kids) => el("section", { class: "ocard" }, el("h2", {}, title), ...kids);
const short1 = s => { const f = String(s || "").replace(/\s+/g, " ").trim(); return f.length > 70 ? f.slice(0, 70) + "..." : f; };

const summary = [];
summary.push(isAgent
  ? `The person worked for ${dur(M.duration_ms)} with ${agentName}, an AI coding assistant, in the folder ${base(S.cwd) || "of the exercise"}.`
  : `The recording shows ${dur(M.duration_ms)} of the program ${agentName} in the folder ${base(S.cwd) || "of the exercise"}; no AI coding assistant was recorded.`);
if (turns.length) {
  let s1 = `They gave the AI ${plural(typedTurns.length, "instruction")}`;
  const extras = [];
  if (interrupts.length) extras.push(`stopped it ${rate(interrupts.length)}`);
  if (tagged("corrects").length) extras.push(`corrected it ${rate(tagged("corrects").length)}`);
  summary.push(s1 + (extras.length ? `, ${extras.join(" and ")}` : "") + ".");
  if (permissions.length) {
    const unknown = permissions.filter(h => h.outcome === "unknown").length;
    const declined = permissions.filter(h => h.outcome === "declined").length;
    summary.push(`The AI asked for permission before ${plural(permissions.length, "action")}; the person approved ${approvedList.length}${declined ? ` and declined ${declined}` : ""}${unknown ? ` (the answer to ${unknown} was removed for sharing)` : ""}.`);
  }
  if (toolDetail) {
    if (allTestsRun.length) summary.push(`The AI ran a recognized test command ${rate(allTestsRun.length)}. ${testAfterLastEdit ? "One ran after the AI's last edit." : lastEdit ? "None was recognized after the AI's last edit." : ""}`);
    else if (allEdits.length) summary.push("The AI edited code; no recognized test command was seen. Check the replay, since tests can run in ways the page does not recognize.");
  }
} else if (!hooks.length) {
  summary.push("No AI assistant events were recorded; the terminal replay shows what happened.");
}
if (P.cut) summary.push(`${P.cut} ${P.cut === 1 ? "instruction or command was" : "instructions or commands were"} removed by the candidate before sharing; agent work after a removed part is shown without its instruction.`);
if (changedCount != null) summary.push(`${plural(changedCount, "file")} changed during the session${toolDetail && changed.length ? `: ${changedByAgent.length} by the AI's edit tools, ${otherChanged.length} by other means` : ""}${newCommits ? `, and ${plural(newCommits, "commit")} ${newCommits === 1 ? "was" : "were"} made` : ""}.`);
if (hasDiff && M.diff.files === 0 && changedCount) summary.push(`The included code changes are empty while ${plural(changedCount, "file")} changed during the session: the folder no longer held the session's changes when this file was written.`);
else if (hasDiff) summary.push(diffStatus === "matches the session end"
  ? `The code changes are included (${plural(M.diff.files, "file")}) and match the end of the session.`
  : `Code changes are included (${plural(M.diff.files, "file")}) as they were when the file was written; they were not confirmed as the end of the session (${diffStatus}).`);
summary.push(M.chain.token_bound
  ? `The session was started with an invitation token and ${edited ? `${edited} events were removed or masked before sharing` : "nothing was removed before sharing"}. Only the verification command with your token (Details tab) confirms it is the token you issued.`
  : `The recording is not linked to an invitation token${edited ? ` and ${edited} events were removed or masked before sharing` : ""}; without the anchors received during the session, it is the candidate's own account.`);

ov.append(card("In short", el("ul", { class: "plain" }, summary.map(x => el("li", {}, x)))));

const limitHit = rows.find(r => r.type === "runtime.warning" && r.payload && r.payload.code === "recording_limit_reached");
const left = what => el("li", {}, el("span", { class: "yn n" }, "left out"), " ", what, el("span", { class: "caveat", style: "margin:0" }, " (recorded, but the candidate did not include it in this file)"));
const yes = (b, what) => el("li", {}, el("span", { class: `yn ${b ? "y" : "n"}` }, b ? "recorded" : "not recorded"), " ", what);
ov.append(card("What was recorded",
  el("ul", { class: "yns" },
    yes(!!S.record_output, limitHit ? `everything shown in the recorded terminal until the recording limit was reached at ${off(limitHit.t_ms)}` : "everything shown in the recorded terminal"),
    P.available && P.text ? yes(true, "the text of the instructions given to the AI") : P.available ? left("the text of the instructions given to the AI") : yes(false, "the text of the instructions given to the AI"),
    hooks.length && !toolCalls.length ? null : yes(toolDetail, "the first line of each command the AI ran, the files it edited and line counts, error text; never file contents"),
    hasDiff ? yes(true, diffStatus === "matches the session end" ? "the code changes at the end of the session" : "the code changes as of when this file was written, not confirmed as the end of the session")
      : exitGit?.payload.diff_sha256 ? left("the code changes (only their fingerprint is in the recording)") : yes(false, "the code changes"),
    S.record_input ? null : yes(false, "keystrokes"),
    S.record_input ? yes(true, "keystrokes, including anything typed at hidden password prompts") : yes(false, "passwords typed at hidden prompts"),
    yes(false, "environment variables"),
    yes(false, "other windows, the browser, other devices, the camera or microphone")),
  el("p", { class: "caveat" }, "The candidate chose what to include in this file. Keep it only as long as your hiring process and data retention policy allow, and delete it afterwards.")));

ov.append(card("Before you rate",
  el("ul", { class: "plain" },
    el("li", {}, "Using the AI was part of the exercise. Using it a lot is not a negative signal; how it was used is what matters."),
    el("li", {}, "Times include reading, thinking and pauses. Do not rank people by speed or by tokens; tokens measure cost, not quality."),
    el("li", {}, "Rate every candidate with the same guide below, and write down the moment that supports each rating."),
    el("li", {}, "The tags on instructions are automatic text heuristics. Read the instruction before relying on one."),
    el("li", {}, "Make the decision with a person in the loop, and give the candidate a chance to explain in a short debrief."))));

// Evaluation guide
const LEVELS = ["Not observed", "Needs development", "Meets", "Strong"];
const COMPETENCIES = [
  {
    id: "understand", name: "Understanding the problem", who: "both",
    ask: "Did the person make sure they understood the task before changing code?",
    evidence: () => [
      typedTurns[0] ? el("li", {}, "First instruction: ", promptLink(typedTurns[0]), typedTurns[0].text ? ` "${short1(typedTurns[0].text)}"` : "") : null,
      toolDetail && firstEdit ? el("li", {}, testBeforeEdit ? ["A recognized test command ran before the AI's first edit: ", momentLink(testBeforeEdit.t_ms)] : ["No recognized test command before the AI's first edit at ", momentLink(firstEdit.t_ms), "; check the replay"]) : null,
      P.text ? el("li", {}, `${plural(typedTurns.filter(t => /\?/.test(t.text || "")).length, "instruction")} asked the AI a question.`) : null,
    ],
  },
  {
    id: "direct", name: "Directing the AI", who: "both",
    ask: "Were the instructions clear, specific and bounded?",
    evidence: () => [
      P.text ? el("li", {}, `${plural(tagged("sets a constraint").length, "instruction")} set a limit, ${tagged("names a file").length} named a file. `, ...tagged("sets a constraint").slice(0, 4).map(t => [promptLink(t), " "])) : el("li", {}, "The instruction text is not included; judge from the replay or ask in the debrief."),
      typedTurns.length && P.available ? el("li", {}, `Typical instruction length: ${num(median(typedTurns.map(t => t.chars)) || 0)} characters.`) : null,
    ],
  },
  {
    id: "judge", name: "Judgment and control", who: "both",
    ask: "Did the person stay in charge: reading what the AI did, approving with care, stopping it when it went the wrong way?",
    evidence: () => [
      !hooks.length ? el("li", {}, "No AI events were recorded; judge from the replay.")
        : permissions.length ? el("li", {}, `${approvedList.length} of ${permissions.length} permission requests approved`, approvedList.length ? [", at ", ...approvedList.slice(0, 5).map(h => [momentLink(h.t_ms), " "])] : null,
            permissions.length > approvedList.length ? ["; not approved: ", ...permissions.filter(h => h.outcome !== "approved").slice(0, 5).map(h => [momentLink(h.t_ms, `${off(h.t_ms)} (${({ declined: "declined", stopped: "Esc", unanswered: "never answered", unknown: "removed for sharing" })[h.outcome] || "not approved"})`), " "])] : null)
        : el("li", {}, "The AI did not ask for permission."),
      !P.available ? el("li", {}, "Interruptions are unknown: the agent's transcript is not in this file.")
        : interrupts.length ? el("li", {}, "Stopped the AI at ", ...interrupts.map(ms => [momentLink(ms), " "]))
        : el("li", {}, `Did not stop the AI mid-task${(M.cuts || []).length ? " in the shared part of the session" : ""}.`),
      tagged("corrects").length || tagged("rephrases").length ? el("li", {}, "Corrected or rephrased: ", ...[...new Set([...tagged("corrects"), ...tagged("rephrases")])].map(t => [promptLink(t), " "])) : null,
    ],
  },
  {
    id: "verify", name: "Verifying the result", who: "technical",
    ask: "Did the person check that the result works, instead of trusting the AI's word?",
    evidence: () => toolDetail ? [
      lastEdit ? el("li", {}, testAfterLastEdit ? ["A recognized test command ran after the AI's last edit: ", momentLink(testAfterLastEdit.t_ms), ` (${testResult(testAfterLastEdit)}${chained(tsum(testAfterLastEdit).command) ? ", the command continued after the tests" : ""})`] : ["No recognized test command after the AI's last edit at ", momentLink(lastEdit.t_ms), "; check the replay"]) : el("li", {}, "The AI made no change with its edit tools."),
      el("li", {}, `${plural(allTestsRun.length, "test run")} in total.`),
      otherChanged.length ? el("li", {}, `${plural(otherChanged.length, "file")} changed outside the AI's edit tools: ${otherChanged.slice(0, 5).map(c => c.path).join(", ")}.`) : null,
    ] : [el("li", {}, hooks.length && !toolCalls.length ? "The AI ran no tools in this session." : "This recording has no details of the AI's commands; use the replay.")],
  },
  {
    id: "outcome", name: "Quality of the result", who: "technical",
    ask: "Is the final code correct, readable and limited to what the task asked?",
    evidence: () => [
      hasDiff && M.diff.files === 0 && changedCount ? el("li", {}, "The included diff is empty although files changed; the code cannot be reviewed from this file.")
        : hasDiff ? el("li", {}, goCode(`Read the code changes (${plural(M.diff.files, "file")})`), `; check against the end of the session: ${diffStatus}.`)
        : el("li", {}, M.diff ? `The code changes were requested but are not in this file: ${M.diff.status}.` : "The code changes are not in this file. Ask the candidate to bundle with --diff, or review their repository."),
      lastTestRun ? el("li", {}, "Last test run: ", momentLink(lastTestRun.t_ms), ` ${testResult(lastTestRun)}${chained(tsum(lastTestRun).command) ? "; the command continued after the tests, so this may be another command's status: watch the moment" : ""}.`) : null,
      newCommits ? el("li", {}, `${plural(newCommits, "commit")}: ${commits.slice(0, 3).map(c => c.subject).join("; ")}.`) : null,
    ],
  },
  {
    id: "communicate", name: "Communication", who: "hr",
    ask: "How clearly did the person express intent to the AI, and explain their choices in the debrief?",
    evidence: () => [
      P.text ? el("li", {}, "Read the instructions in order on the Timeline tab.") : el("li", {}, "Instruction text not included."),
      el("li", {}, "Use the debrief questions below; this is where most of the evidence for this competency comes from."),
    ],
  },
];
const storeKey = `agentrecorder-eval-${S.id}-${String(M.chain.head).slice(0, 12)}`;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storeKey) || "{}") || {}; } catch { saved = {}; }
const persist = () => { try { localStorage.setItem(storeKey, JSON.stringify(saved)); } catch {} };
saved.ratings = saved.ratings || {}; saved.notes = saved.notes || {};
const reviewer = el("input", { type: "text", class: "inp", placeholder: "Your name", value: saved.reviewer || "", oninput: e => { saved.reviewer = e.target.value; persist(); } });
const roleSel = el("select", { class: "inp", onchange: e => { saved.role = e.target.value; persist(); } }, ["HR or recruiter", "Technical reviewer", "Hiring manager"].map(r => el("option", saved.role === r ? { selected: "selected" } : {}, r)));
const guide = card("Evaluation guide",
  el("p", { class: "caveat", style: "margin:0 0 12px" }, "The page points to the moments worth looking at; you give the rating. Ratings and notes stay in this browser until you download them."),
  el("div", { class: "who" }, el("label", {}, "Reviewer ", reviewer), el("label", {}, "Role ", roleSel)),
  ...COMPETENCIES.map(c => {
    const buttons = LEVELS.map(level => el("button", { type: "button", class: "lvl", "aria-pressed": String(saved.ratings[c.id] === level), onclick: e => {
      saved.ratings[c.id] = saved.ratings[c.id] === level ? undefined : level; persist();
      for (const b of e.target.parentNode.children) b.setAttribute("aria-pressed", String(b.textContent === saved.ratings[c.id]));
      $(`print-rating-${c.id}`).textContent = `Rating: ${saved.ratings[c.id] || "not rated"}`;
    } }, level));
    return el("div", { class: "comp" },
      el("div", { class: "comp-h" }, el("h3", {}, c.name), el("span", { class: `who-tag ${c.who}` }, { both: "HR and technical", technical: "technical reviewer", hr: "HR" }[c.who])),
      el("p", { class: "ask" }, c.ask),
      el("ul", { class: "evidence" }, c.evidence().filter(Boolean)),
      el("div", { class: "levels" }, buttons),
      el("div", { class: "print-only", id: `print-rating-${c.id}` }, `Rating: ${saved.ratings[c.id] || "not rated"}`),
      el("textarea", { class: "inp note", rows: "3", "aria-label": `Note on ${c.name}`, placeholder: "Note and the moment that supports it", oninput: e => { saved.notes[c.id] = e.target.value; $(`print-note-${c.id}`).textContent = e.target.value; persist(); } }, saved.notes[c.id] || ""),
      el("div", { class: "print-only", id: `print-note-${c.id}` }, saved.notes[c.id] || ""));
  }));
ov.append(guide);

// Debrief questions
const questions = [];
questions.push(turns.length ? ["Walk me through how you decided what to ask the AI first.", null] : ["Walk me through what you did in this terminal, step by step.", null]);
for (const ms of interrupts.slice(0, 2)) questions.push([`At ${off(ms)} you stopped the AI. What did you notice?`, ms]);
for (const h of permissions.filter(h => h.outcome === "declined").slice(0, 2)) questions.push([`At ${off(h.t_ms)} you declined "${short1(tsum(h).command || h.payload.tool_name)}". What made you decide that?`, h.t_ms]);
for (const t of [...new Set(tagged("corrects").concat(tagged("rephrases")))].slice(0, 2)) questions.push([`At ${off(t.t_ms)} you rephrased or corrected your request. What was missing before?`, t.t_ms]);
for (const h of approvedList.filter(h => tsum(h).command).slice(0, 2)) questions.push([`At ${off(h.t_ms)} you approved "${short1(tsum(h).command)}". What did you check before approving?`, h.t_ms]);
if (toolDetail && lastEdit && !testAfterLastEdit) questions.push([`After the AI's last edit at ${off(lastEdit.t_ms)}, the record shows no test run. How did you check that the result works?`, lastEdit.t_ms]);
for (const c of changedByAgent.filter(c => /test/i.test(c.path)).slice(0, 1)) questions.push([`The AI edited ${c.path}. Did you review that change, and was it what you wanted?`, null]);
for (const c of otherChanged.slice(0, 2)) questions.push([`${c.path} changed outside the AI's edits. What changed, and why?`, null]);
if (P.available && !P.text) questions.push(["The instruction text is not included. Can you describe what you asked the AI at each step?", null]);
questions.push(["If you had another 30 minutes, what would you improve or check?", null]);
ov.append(card("Debrief questions",
  el("p", { class: "caveat", style: "margin:0 0 8px" }, "Generated from this session. Ask the candidate to narrate the replay; compare what they say with the timeline."),
  el("ol", { class: "qs" }, questions.map(([q, ms]) => el("li", {}, q, ms != null ? [" ", momentLink(ms, "watch")] : null)))));

// Glossary and actions
ov.append(card("Words used on this page",
  el("dl", { class: "gloss" }, [
    ["Instruction (prompt)", "What the person typed to the AI."],
    ["Tool call", "An action the AI took: running a command, reading or editing a file."],
    ["Permission request", "The AI asked before an action; the person approved or not."],
    ["Stopped (interrupted)", "The person pressed Esc to stop the AI mid-task."],
    ["Tokens", "Units of text the AI processed. A measure of cost, not of quality."],
    ["Test run", "A command that runs the project's automated checks. Exit 0 means the whole command reported success; when the AI ran other commands after the tests in the same line, it may not be the tests' result."],
    ["Verification", "A check, run on a computer with agentrecorder, that the recording was not edited after the session."],
  ].flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]))));

function evaluationMarkdown() {
  const lines = [`# Evaluation of session ${S.id}`, "", `- Bundle: ${bundleName}`, `- Recorded: ${when(S.created_at_ns)}, ${dur(M.duration_ms)}, ${agentName}`, `- Reviewer: ${saved.reviewer || "-"} (${saved.role || "HR or recruiter"})`, `- Written: ${new Date().toISOString().slice(0, 16).replace("T", " ")} UTC`, "", "## Summary", "", ...summary.map(x => `- ${x.replace(" (Details tab)", "")}`), "", "## Ratings", ""];
  const quote = t => t.trim() ? t.trim().split("\n").map(l => `> ${l}`).join("\n") : "No note.";
  for (const c of COMPETENCIES) lines.push(`### ${c.name}`, "", `Rating: ${saved.ratings[c.id] || "not rated"}`, "", quote(saved.notes[c.id] || ""), "");
  lines.push("## Debrief questions", "", ...questions.map(([q], i) => `${i + 1}. ${q}`), "");
  if (COMPETENCIES.some(c => saved.ratings[c.id])) lines.push("Ratings were given by a person; the page only listed evidence.");
  return lines.join("\n") + "\n";
}
ov.append(el("div", { class: "actions" },
  el("button", { type: "button", class: "btn", onclick: () => {
    const a = el("a", { href: URL.createObjectURL(new Blob([evaluationMarkdown()], { type: "text/markdown" })), download: `evaluation-${S.id}.md` });
    document.body.append(a); a.click(); a.remove();
  } }, "Download evaluation (.md)"),
  el("button", { type: "button", class: "btn ghost", onclick: () => { showTab("overview"); window.print(); } }, "Print or save as PDF")));

// Code changes
const code = $("code");
if (hasDiff && M.diff.files === 0 && changedCount) {
  code.append(el("div", { class: "empty" }, `The included diff is empty, but ${plural(changedCount, "file")} changed during the session (Details tab). The folder no longer held the session's changes when this file was written, so the code cannot be reviewed from this file.`));
} else if (hasDiff && !diffShown) {
  code.append(el("div", { class: "empty" }, `The code changes (${plural(M.diff.files, "file")}, ${num(M.diff.bytes)} bytes; ${diffStatus}) are too large to show here. Open diff.patch in the bundle.`));
} else if (!hasDiff) {
  code.append(el("div", { class: "empty" }, M.diff && M.diff.status ? `Code changes: ${M.diff.status}.` : "The code changes are not in this bundle. The candidate can include them with ",
    !M.diff ? el("code", {}, `agentrecorder bundle ${S.id} --diff`) : null, !M.diff ? "; the file list is in the Details tab." : null));
} else {
  const ok = diffStatus === "matches the session end";
  code.append(el("div", { class: "badges", style: "margin:0 0 12px" },
    el("span", { class: `badge ${ok ? "ok" : "warn"}` }, el("span", { class: "dot" }), ok ? "Matches the code at the end of the session" : diffStatus),
    el("span", { class: "badge" }, `${plural(M.diff.files, "file")} against ${short(M.diff.base)}`),
    M.diff.sha256_at_exit ? el("span", { class: "caveat", style: "margin:0" }, "verify checks this against the hash recorded when the session ended") : null));
  const parts = D.diff.split(/^(?=diff --git )/m).filter(x => x.startsWith("diff --git "));
  for (const part of parts) {
    const lines = part.split("\n");
    const unq = x => {
      x = x.replace(/\t$/, "");
      const m = /^"(.*)"$/.exec(x);
      if (!m) return x;
      const bytes = [];
      const body = m[1];
      for (let i = 0; i < body.length; i++) {
        if (body[i] !== "\\") { bytes.push(...new TextEncoder().encode(body[i])); continue; }
        const nx = body[++i];
        if (/[0-7]/.test(nx)) { bytes.push(parseInt(body.substr(i, 3), 8)); i += 2; }
        else bytes.push(({ t: 9, n: 10, r: 13, a: 7, b: 8, f: 12, v: 11 })[nx] ?? nx.charCodeAt(0));
      }
      return new TextDecoder().decode(new Uint8Array(bytes));
    };
    const plusLine = lines.find(l => l.startsWith("+++ b/")), minusLine = lines.find(l => l.startsWith("--- a/"));
    const renameTo = lines.find(l => l.startsWith("rename to ") || l.startsWith("copy to "));
    const header = lines[0].slice("diff --git ".length);
    const halves = () => {
      const q = /^"a\/((?:[^"\\]|\\.)*)" "b\/((?:[^"\\]|\\.)*)"$/.exec(header);
      if (q) return `"${q[2]}"`;
      const body = header.slice(2), n = (body.length - 3) / 2;
      return Number.isInteger(n) && body.slice(n, n + 3) === " b/" ? body.slice(n + 3) : body.replace(/ b\/.*$/, "");
    };
    const path = renameTo ? unq(renameTo.replace(/^(rename|copy) to /, "")) : plusLine ? unq(plusLine.slice(6)) : minusLine ? unq(minusLine.slice(6)) : unq(halves());
    const kinds = [];
    let inHunk = false;
    for (const l of lines) {
      if (l.startsWith("diff --git ")) inHunk = false;
      if (l.startsWith("@@")) { inHunk = true; kinds.push("h"); continue; }
      kinds.push(!inHunk ? "m" : l.startsWith("+") ? "a" : l.startsWith("-") ? "r" : l.startsWith("\\") ? "m" : "");
    }
    const added = kinds.filter(k => k === "a").length;
    const removed = kinds.filter(k => k === "r").length;
    const a = editedFor(path);
    const pre = el("pre", { class: "diff" });
    const shown = lines.slice(0, 1500);
    shown.forEach((l, i) => pre.append(el("span", { class: kinds[i] }, l + "\n")));
    if (lines.length > shown.length) pre.append(el("span", { class: "m" }, `... ${lines.length - shown.length} more lines in diff.patch\n`));
    code.append(el("details", { class: "dfile", open: parts.length <= 8 ? "open" : null },
      el("summary", {}, el("span", { class: "path" }, path), el("span", { class: "plus" }, `+${added}`), el("span", { class: "minus" }, `-${removed}`),
        a ? el("span", { class: "k agent" }, `AI edit in ${[...a.turns].map(n => `#${n}`).join(", ")}`) : toolDetail ? el("span", { class: "k warn" }, "not by the AI's edit tools") : null),
      pre));
  }
}

const initial = (location.hash || "").slice(1);
showTab(TABS.some(([t]) => t === initial) ? initial : "overview");

// Follow playback
function followPlayback() {
  let last = null, lastTurn = null;
  setInterval(() => {
    const t = clock.toRecorded(player.getCurrentTime());
    $("now").textContent = off(t);
    let cur = null;
    for (const [ms, n] of rendered) { if (ms <= t) cur = n; else break; }
    if (cur !== last) { last && last.classList.remove("current"); cur && cur.classList.add("current"); last = cur; }
    let turn = null;
    for (const [ms, n] of storyRows) { if (ms <= t) turn = n; else break; }
    if (turn !== lastTurn) { lastTurn && lastTurn.classList.remove("current"); turn && turn.classList.add("current"); lastTurn = turn; }
  }, 500);
}
</script>
</body>
</html>
