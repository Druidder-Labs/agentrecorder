<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; font-src data:; img-src data:; worker-src blob:">
<title>agentrecorder session</title>
<style>__AGENTRECORDER_PLAYER_CSS__</style>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
  --accent: #2f6fde; --ok: #1f8a4c; --bad: #c4372d; --warn: #a86500; --chip: #eef1f5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #191d23; --text: #e6e9ee; --muted: #9aa4b1; --line: #2b313a;
    --accent: #6ea0ff; --ok: #4cc27f; --bad: #ff7468; --warn: #e0a344; --chip: #242a33;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d23; --text: #e6e9ee; --muted: #9aa4b1; --line: #2b313a;
  --accent: #6ea0ff; --ok: #4cc27f; --bad: #ff7468; --warn: #e0a344; --chip: #242a33;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 24px 8px; }
header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
header .cmd { font-family: var(--mono); color: var(--muted); word-break: break-all; }
main { padding: 8px 24px 32px; display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.tile { padding: 12px 14px; }
.tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .sub { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.panel h2 { margin: 0; padding: 12px 14px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
.panel .body { padding: 12px 14px; }
.player-wrap { padding: 0; overflow: hidden; border-radius: 0 0 8px 8px; }
.notice { padding: 14px; color: var(--muted); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--text); }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.filters button { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.filters button[aria-pressed="false"] { opacity: .45; }
.rows { max-height: 520px; overflow: auto; }
.row { display: grid; grid-template-columns: 86px 92px minmax(0, 1fr); gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.row:hover { background: var(--chip); }
.row.current { box-shadow: inset 3px 0 0 var(--accent); }
.row .t { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.row .d { word-break: break-word; }
.row.redacted .d, .row.cut .d { color: var(--warn); }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-all; }
.mono { font-family: var(--mono); font-size: 12px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.bar .track { position: relative; height: 18px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .35; }
.bar .name { position: relative; padding: 0 6px; font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .n { text-align: right; font-family: var(--mono); font-size: 12px; }
.caveat { color: var(--muted); font-size: 12px; margin-top: 10px; }
code { font-family: var(--mono); font-size: 12px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
@media (max-width: 900px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 72px minmax(0, 1fr); }
  .row .k { display: none; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">agentrecorder session</h1>
  <div class="cmd" id="cmd"></div>
</header>
<main>
  <section class="tiles" id="tiles"></section>
  <div class="grid">
    <div class="col">
      <section class="panel">
        <h2>Terminal</h2>
        <div class="player-wrap" id="player"></div>
      </section>
      <section class="panel">
        <h2>Timeline</h2>
        <div class="filters" id="filters"></div>
        <div class="rows" id="rows"></div>
      </section>
    </div>
    <div class="col">
      <section class="panel"><h2>Session</h2><div class="body" id="session"></div></section>
      <section class="panel"><h2>Agent activity</h2><div class="body" id="agent"></div></section>
      <section class="panel"><h2>Integrity</h2><div class="body" id="integrity"></div></section>
    </div>
  </div>
</main>
<script id="data" type="application/json">__AGENTRECORDER_DATA__</script>
<script>__AGENTRECORDER_PLAYER_JS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const M = D.manifest, S = M.session;

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c instanceof Node ? c : String(c));
  return n;
}
function dur(ms) {
  if (ms == null) return "unavailable";
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : m ? `${m}m ${String(r).padStart(2, "0")}s` : `${r}s`;
}
function off(ms) {
  const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map(x => String(x).padStart(2, "0")).join(":");
}
const short = h => (h ? String(h).slice(0, 12) : "-");

const CATS = {
  agent: t => t === "agent.hook",
  shell: t => t === "shell.command_finished",
  marks: t => t === "user.mark",
  git: t => t === "git.snapshot",
  notices: t => t.startsWith("runtime.") || t === "terminal.notification",
  session: t => t.startsWith("session.") || t.startsWith("process.") || t === "terminal.resized",
  redacted: () => false,
};
function category(r) {
  if (r.fate === "redacted" && (r.type === "terminal.output" || r.type === "terminal.input" || r.type === "terminal.snapshot")) return "redacted";
  if (r.type === "cut") return "redacted";
  for (const [k, f] of Object.entries(CATS)) if (f(r.type)) return k;
  return "session";
}
function describe(r) {
  const p = r.payload || {};
  switch (r.type) {
    case "agent.hook": return [p.hook_event_name, p.tool_name, p.notification_type].filter(Boolean).join(" ") + (p.message ? `: ${p.message}` : "");
    case "shell.command_finished": return `command finished, exit ${p.exit_code ?? "unknown"}`;
    case "user.mark": return p.label ? `mark: ${p.label}` : "mark";
    case "git.snapshot": return `git ${p.phase}: HEAD ${short(p.head)}${p.dirty_paths != null ? `, ${p.dirty_paths} paths modified or untracked` : ""}`;
    case "session.created": return `created: ${(p.command || []).join(" ")}`;
    case "process.started": return `process started, pid ${p.pid}`;
    case "process.exited": return p.exit_code != null ? `process exited with code ${p.exit_code}` : `process killed by signal ${p.signal}`;
    case "session.attached": return `attached (${p.client || "client"})`;
    case "session.detached": return `detached (${p.reason})`;
    case "session.stop_requested": return `stop requested, signal ${p.signal}`;
    case "session.terminated": return `terminated: ${p.reason}`;
    case "terminal.resized": return `resized to ${p.cols}x${p.rows}`;
    case "terminal.notification": return `notification (${p.source}): ${p.text}`;
    case "runtime.warning": case "runtime.error": return `${p.code}: ${p.message || ""}`;
    case "terminal.output": return "terminal output redacted";
    case "terminal.input": return "terminal input redacted";
    case "terminal.snapshot": return "screen snapshot redacted";
    case "cut": return r.text;
    default: return r.type;
  }
}

document.title = `agentrecorder ${S.id} - ${M.program}`;
document.getElementById("title").textContent = `Session ${S.id} - ${M.program}`;
document.getElementById("cmd").textContent = M.command_display;

const rows = D.timeline.slice();
for (const c of M.cuts || []) rows.push({ type: "cut", t_ms: c.from_ms, fate: "cut", text: `cut ${off(c.from_ms)}-${off(c.to_ms)} (${c.events} events removed)` });
rows.sort((a, b) => a.t_ms - b.t_ms || (a.seq ?? 0) - (b.seq ?? 0));

const hooks = rows.filter(r => r.type === "agent.hook");
const shell = rows.filter(r => r.type === "shell.command_finished");
const failed = shell.filter(r => r.payload && r.payload.exit_code != null && r.payload.exit_code !== 0).length;
const marks = rows.filter(r => r.type === "user.mark");
const exitText = S.exit_code != null ? `code ${S.exit_code}` : S.exit_signal != null ? `signal ${S.exit_signal}` : S.status;
const exitClass = S.exit_code === 0 ? "ok" : "bad";
const tiles = [
  ["Duration", dur(M.duration_ms), new Date(S.created_at_ns / 1e6).toISOString().replace("T", " ").slice(0, 19) + " UTC"],
  ["Exit", el("span", { class: `pill ${exitClass}` }, exitText), S.status],
  ["Commands", shell.length ? shell.length : "unavailable", shell.length ? `${failed} failed (OSC 133)` : "no OSC 133 marks"],
  ["Agent events", hooks.length || "unavailable", hooks.length ? `${hooks.filter(h => h.payload.hook_event_name === "PreToolUse").length} tool calls` : "no agent hooks"],
  ["Markers", marks.length, "user marks"],
  ["Edited for sharing", (M.fates.redacted || 0) + (M.fates.cut || 0), `${M.fates.redacted || 0} redacted, ${M.fates.cut || 0} cut`],
];
document.getElementById("tiles").append(...tiles.map(([l, v, s]) =>
  el("div", { class: "tile" }, el("div", { class: "label" }, l), el("div", { class: "value" }, v), el("div", { class: "sub" }, s))));

let player = null;
const host = document.getElementById("player");
if (window.AsciinemaPlayer) {
  player = AsciinemaPlayer.create({ data: D.cast }, host, { fit: "width", idleTimeLimit: 3, poster: `npt:${Math.max(0, (M.duration_ms || 0) / 1000)}` });
} else {
  host.append(el("div", { class: "notice" }, "The terminal player did not start in this browser. The timeline and summary still work; ",
    el("code", {}, `agentrecorder replay ${S.id}`), " plays the recording on the machine that made it, and ", el("code", {}, "session.cast"), " plays in any asciinema player."));
}

const active = new Set(Object.keys(CATS));
const filters = document.getElementById("filters");
const list = document.getElementById("rows");
const counts = {};
for (const r of rows) { const c = category(r); counts[c] = (counts[c] || 0) + 1; }
for (const k of Object.keys(CATS)) {
  if (!counts[k]) continue;
  const b = el("button", { type: "button", "aria-pressed": "true", onclick: () => {
    active.has(k) ? active.delete(k) : active.add(k);
    b.setAttribute("aria-pressed", String(active.has(k)));
    render();
  } }, `${k} ${counts[k]}`);
  filters.append(b);
}
let rendered = [];
function render() {
  list.replaceChildren();
  rendered = [];
  for (const r of rows) {
    const c = category(r);
    if (!active.has(c)) continue;
    const n = el("div", { class: `row ${r.fate}`, title: r.timestamp || "", onclick: () => player && player.seek(r.t_ms / 1000) },
      el("span", { class: "t" }, off(r.t_ms)), el("span", { class: "k" }, el("span", { class: "pill" }, c)), el("span", { class: "d" }, describe(r)));
    rendered.push([r.t_ms, n]);
    list.append(n);
  }
  if (!rendered.length) list.append(el("div", { class: "notice" }, "No events in the selected categories."));
}
render();
if (player) {
  let last = null;
  setInterval(() => {
    const t = player.getCurrentTime() * 1000;
    let cur = null;
    for (const [ms, n] of rendered) { if (ms <= t) cur = n; else break; }
    if (cur !== last) { last && last.classList.remove("current"); cur && cur.classList.add("current"); last = cur; }
  }, 500);
}

const git = rows.filter(r => r.type === "git.snapshot");
const gitPhase = ph => git.find(g => g.payload.phase === ph);
const kv = pairs => el("dl", {}, pairs.filter(p => p[1] != null).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]));
document.getElementById("session").append(kv([
  ["Program", M.program],
  ["Working dir", S.cwd],
  ["Git HEAD", git.length ? `${short(gitPhase("start")?.payload.head)} -> ${short(gitPhase("exit")?.payload.head)}` : "unavailable"],
  ["Agent session", S.agent_session_id],
  ["Input recorded", S.record_input ? "yes" : "no"],
  ["Output recorded", S.record_output ? "yes" : "no"],
  ["Recorder", `${M.generator.name} ${M.generator.version}`],
  ["Bundled", M.created_at],
]));

const agent = document.getElementById("agent");
if (!hooks.length) {
  agent.append(el("div", {}, "No agent hook events. Claude Code reports them when started as ", el("code", {}, "agentrecorder run -- claude"), "."));
  agent.append(el("div", { class: "caveat" }, "Tokens, cost and model latency are not collected: the agent hooks do not report them, and agentrecorder shows measured values only."));
} else {
  const by = {};
  for (const h of hooks) { const k = h.payload.tool_name ? `tool: ${h.payload.tool_name}` : h.payload.hook_event_name; by[k] = (by[k] || 0) + 1; }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const max = top[0][1];
  agent.append(el("div", { class: "bars" }, top.map(([k, n]) => el("div", { class: "bar" },
    el("div", { class: "track" }, el("div", { class: "fill", style: `width:${(100 * n / max).toFixed(1)}%` }), el("div", { class: "name" }, k)),
    el("div", { class: "n" }, n)))));
  agent.append(el("div", { class: "caveat" }, "Counts of hook events by type and tool. Tokens, cost and model latency are not collected: the hooks do not report them."));
}

const files = Object.entries(M.files).map(([name, f]) => [name, el("span", { class: "mono" }, `${f.sha256.slice(0, 16)}... ${f.bytes} B`)]);
document.getElementById("integrity").append(
  kv([
    ["Chain", el("span", { class: "mono" }, `${M.chain.algorithm}, ${M.chain.events} events`)],
    ["Head", el("span", { class: "mono" }, M.chain.head)],
    ["Kept", el("span", { title: "Unchanged events; verify rechecks each one against its recorded hash" }, M.fates.kept || 0)],
    ["Redacted", el("span", { title: "Events where --redact replaced matches with '*'; present but not hash-checked" }, `${M.fates.redacted || 0} events, ${M.redaction.matches} matches`)],
    ["Cut", el("span", { title: "Events removed by --cut; their hashes stay in the chain so the gap is visible" }, M.fates.cut || 0)],
    ...files,
  ]),
  el("div", { class: "caveat" }, "Kept: unchanged and hash-checked. Redacted: matches replaced with '*', present but not hash-checked. Cut: removed; the hash stays in the chain so the gap is visible. Check with ",
    el("code", {}, "agentrecorder verify <dir> --anchors anchors.jsonl"),
    ". Without anchors received while the session ran, the bundle is consistent with itself but is self-reported: it shows how the session went, not that nothing happened outside the terminal."),
);
</script>
</body>
</html>
